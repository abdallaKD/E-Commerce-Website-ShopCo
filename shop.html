<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="./CSS/shop.css">
    <link rel="stylesheet" href="./CSS/layout.css">
    <link rel="stylesheet" href="./CSS/normalize.css">
    <link rel="stylesheet" href="./CSS/all.min.css">
    <!-- Robot Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="offer"></div>
    <div id="nav"></div>

    <div class="shop-section">
        <div class="container">
            <div class="filters">
                <h3>Filters <i class="fa-solid fa-sliders fa-rotate-270"></i></h3>

                <div class="filter-box">
                    <div id="categories"></div>
                </div>

                <div class="filter-box">
                    <h4>Price</h4>
                    <input type="range" id="priceRange" min="0" max="2000" value="2000">
                    <span id="priceValue">$2000</span>
                </div>

                <button class="apply-btn">Apply Filter</button>
            </div>
            <div class="shop-products">
                <div class="products-header">
                    <h3 id="categoryTitle">All Products</h3>

                    <div class="sort-box">
                        <span>Sort by:</span>
                        <select id="sortSelect">
                            <option value="default">Most Popular</option>
                            <option value="priceLow">Price: Low to High</option>
                            <option value="priceHigh">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                        </select>
                    </div>
                </div>
                <div class="products-grid"></div>

                <div class="pagination">
                    <button id="prev"><i class="fa-solid fa-arrow-left"></i>Previous</button>
                    <div id="pages"></div>
                    <button id="next">Next<i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="./JS/shop.js"></script>
</body>
</html>
